<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weather">
<meta name="theme-color" content="#13294B">
<title>Weather</title>
<link rel="apple-touch-icon" id="touchIcon" href="">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#13294B;--ink:#0F1E33;--mute:#5E6A78;--bg:#EAF0EE;--card:#FFFFFF;--line:#DAE2DF;--row:#F2F6F5;
  --fairway:#1F5FA8;--fairway2:#3E8CD1;
  --g:#1B7A40;--a:#B26A00;--r:#C62828;
  --sans:"Barlow",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --num:"Barlow Semi Condensed","Barlow",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 1px 2px rgba(15,30,51,.08),0 10px 30px rgba(15,30,51,.10);
}
@media (prefers-color-scheme:dark){:root{
  --ink:#E7EDF3;--mute:#95A3B4;--bg:#0B1420;--card:#131F30;--line:#22314A;--row:#172538;
  --g:#4CC47A;--a:#F0A93A;--r:#FF6B6B;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
input:focus-visible,button:focus-visible{outline:3px solid #6FA8E8;outline-offset:2px}

/* brand header */
.top{background:linear-gradient(170deg,#13294B 0%,#17385F 70%,#1E4C5A 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 20px 52px;position:relative;overflow:hidden}
.top .brand{display:flex;align-items:center;gap:12px;max-width:520px;margin:0 auto;position:relative;z-index:1}
.top .mark{width:44px;height:44px;flex:0 0 44px}
.top h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.top p{margin:2px 0 0;font-size:15px;color:#B8C9DF}

main{max-width:520px;margin:0 auto;padding:0 14px calc(env(safe-area-inset-bottom) + 40px)}
.planner{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px 16px 16px;margin-top:-34px;position:relative;z-index:2}
body.has-result .planner{margin-top:18px}
.planner h3{margin:0 0 4px;font-size:18px;font-weight:700}
.planner .lead{margin:0 0 14px;font-size:14px;color:var(--mute)}
label.h{display:block;font-size:14px;font-weight:600;color:var(--mute);margin:16px 0 8px}
label.h:first-of-type{margin-top:0}
.row{display:flex;gap:8px}
input[type=text],input[type=search]{flex:1;min-width:0;font:inherit;font-size:17px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);-webkit-appearance:none}
input::placeholder{color:var(--mute)}
.btn{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:600;background:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){.btn{background:#2A5AA0}}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.go{width:100%;margin-top:18px;padding:16px;font-size:18px;font-weight:700;background:var(--fairway);display:flex;align-items:center;justify-content:center;gap:10px}
.btn.go svg{width:20px;height:20px}
.btn:disabled{opacity:.4}
.locbtn{margin-top:8px;width:100%;border:1px dashed var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:11px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.locbtn svg{width:17px;height:17px;color:var(--fairway2)}
.list{margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 14px}
.list button:first-child{border-top:0}
.list b{display:block;font-size:16px;font-weight:600}
.list span{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.flag{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--fairway2);margin-right:7px;vertical-align:2px}
.recent{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.recent button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500}
.picked{margin-top:10px;background:var(--bg);border-radius:12px;padding:10px 12px;border-left:4px solid var(--fairway2)}
.picked small{display:block;color:var(--mute);font-size:13px;margin-bottom:6px}
.picked input{background:var(--card)!important}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.days::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;text-align:center;min-width:66px}
.chip span{display:block;font-size:12px;color:var(--mute);font-weight:500}
.chip b{display:block;font-family:var(--num);font-size:17px;font-weight:600;margin-top:1px}
.chip.on{background:var(--fairway);border-color:var(--fairway);color:#fff}
.chip.on span{color:#CFE0F5}
.status{font-size:14px;color:var(--mute);margin:10px 2px 0;min-height:1.2em}
.status.err{color:var(--r)}

/* result */
#out{display:none;margin:0 -14px}
body.has-result main{padding-top:0}
#out.show{display:block}
body.has-result .top{display:none}
.hero{position:relative;color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 10px}
.hero.sun{background:linear-gradient(165deg,#1C5FA8 0%,#3E8CD1 60%,#7DB8E3 100%)}
.hero.part{background:linear-gradient(165deg,#244F82 0%,#4B7DAF 60%,#8FB2D3 100%)}
.hero.cloud{background:linear-gradient(165deg,#34465E 0%,#5B6E86 60%,#8795A8 100%)}
.hero.wet{background:linear-gradient(165deg,#1F2F44 0%,#3E5169 60%,#627489 100%)}
.hero.storm{background:linear-gradient(165deg,#1A1D30 0%,#383E5C 60%,#555C7E 100%)}
.hero.snow{background:linear-gradient(165deg,#4D6684 0%,#7089A6 60%,#9DB1C7 100%)}
.hero-top{display:flex;align-items:center;gap:8px}
.hero h2{margin:0;flex:1;min-width:0;font-size:20px;line-height:1.15;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtns{display:flex;gap:6px;flex:0 0 auto}
.hbtns button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.hbtns svg{width:17px;height:17px}
.hero-main{display:flex;align-items:center;gap:8px;margin-top:4px}
.hero-main canvas{width:56px;height:56px;flex:0 0 56px}
.hero .temp{font-family:var(--num);font-size:42px;line-height:1;font-weight:600;white-space:nowrap}
.hero .temp small{font-size:22px;font-weight:500;color:rgba(255,255,255,.75)}
.hero .meta{margin-left:6px;min-width:0}
.hero .cond{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .date{font-size:14px;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1.35fr;margin-top:6px;background:rgba(255,255,255,.14);border-radius:10px;padding:5px 2px}
.stats div{text-align:center;padding:0 3px;border-left:1px solid rgba(255,255,255,.22);min-width:0}
.stats div:first-child{border-left:0}
.stats span{display:block;font-size:11px;color:rgba(255,255,255,.8);white-space:nowrap}
.stats b{display:block;font-family:var(--num);font-size:17px;font-weight:600;line-height:1.15;white-space:nowrap}
.stats b small{font-size:12px;font-weight:500;color:rgba(255,255,255,.8);margin-left:1px}
.stats b.r,.stats b.a{display:inline-block;color:#fff;border-radius:6px;padding:0 5px;margin-top:1px}.stats b.r{background:#C62828}.stats b.a{background:#B26A00}.stats b.r small,.stats b.a small{color:#fff}

.panel{background:var(--card)}
table.wx{width:100%;border-collapse:collapse;table-layout:fixed;font-family:var(--num);font-size:15px;font-variant-numeric:tabular-nums}
table.wx th{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--mute);line-height:1.1;padding:4px 1px;text-align:center;border-bottom:1px solid var(--line)}
table.wx td{padding:0 1px;height:var(--rh,28px);line-height:1;text-align:center;white-space:nowrap;font-weight:500;border-bottom:1px solid var(--line)}
table.wx tr:last-child td{border-bottom:0}
table.wx tr:nth-child(even) td{background:var(--row)}
table.wx tr.bw td{background:rgba(62,140,209,.14)}
table.wx tr.bw td:first-child{box-shadow:inset 3px 0 0 var(--fairway2)}
table.wx td.t{font-weight:700}
table.wx td.sky canvas{display:block;margin:0 auto;width:calc(var(--rh,28px) - 3px);height:calc(var(--rh,28px) - 3px);max-width:30px;max-height:30px}
table.wx td.tf{font-weight:700}
table.wx td.g{color:var(--g);font-weight:600}
table.wx td.a{color:var(--a);font-weight:700}
table.wx td.r{color:var(--r);font-weight:700}
table.wx td .dim{color:var(--mute);font-weight:500}
.arr{display:block;margin:0 auto;width:1em;height:1em;color:var(--ink)}
.fc-foot{padding:10px 14px 12px;font-size:12px;line-height:1.45;color:var(--mute);border-top:1px solid var(--line)}
.fc-foot .u{color:var(--ink);opacity:.8;margin-bottom:4px}
#sb{position:fixed;left:0;bottom:0;height:env(safe-area-inset-bottom);width:0;pointer-events:none}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 44 44" aria-hidden="true"><defs><linearGradient id="mk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C5FA8"/><stop offset="1" stop-color="#6FB0E3"/></linearGradient></defs><rect width="44" height="44" rx="11" fill="url(#mk)"/><circle cx="17" cy="17" r="7" fill="#FFC21A"/><path d="M14 33h19a6 6 0 000-12 8 8 0 00-15.3 2.2A5 5 0 0014 33z" fill="#fff"/></svg>
    <div><h1>Weather</h1><p>Seven forecast models, one hourly consensus</p></div>
  </div>
</header>
<div id="sb"></div>
<main>
  <section id="out">
    <div class="hero" id="heroBox">
      <div class="hero-top"><h2 id="hTitle"></h2><div class="hbtns">
        <button id="share" type="button" aria-label="Share PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></svg></button>
        <button id="refresh" type="button" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
        <button id="change" type="button" aria-label="Change place or day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
      </div></div>
      <div id="hero"></div>
    </div>
    <div class="panel"><div id="fc"></div></div>
  </section>
  <section class="planner" id="planner">
    <h3>Check the forecast</h3>
    <p class="lead">Pick a place and a day for an hour-by-hour forecast.</p>
    <label class="h" for="q">Place</label>
    <form class="row" id="searchForm" onsubmit="return false">
      <input id="q" type="search" placeholder="City, town or place" autocomplete="off" enterkeyhint="search">
      <button class="btn" id="searchBtn" type="submit">Find</button>
    </form>
    <button class="locbtn" id="locBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Use my location</button>
    <div id="results"></div>
    <div id="picked"></div>
    <div class="recent" id="recent"></div>
    <label class="h">Day</label>
    <div class="days" id="days"></div>
    <button class="btn go" id="go" type="button" disabled>Show forecast</button>
    <div class="status" id="status"></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const MODELS = [
  {id:'ecmwf_ifs025',        name:'ECMWF',          meta:'ecmwf_ifs025'},
  {id:'ukmo_seamless',       name:'Met Office',     meta:'ukmo_global_deterministic_10km'},
  {id:'icon_seamless',       name:'DWD ICON',       meta:'dwd_icon'},
  {id:'gfs_seamless',        name:'NOAA GFS',       meta:'ncep_gfs013'},
  {id:'metno_seamless',      name:'MET Norway/Yr',  meta:'metno_nordic_pp'},
  {id:'meteofrance_seamless',name:'Météo-France',   meta:'meteofrance_arpege_world025'},
  {id:'gem_seamless',        name:'Env. Canada',    meta:'cmc_gem_gdps'}
];
const HV = ['temperature_2m','apparent_temperature','precipitation_probability','precipitation','weather_code','cloud_cover','wind_speed_10m','wind_gusts_10m','wind_direction_10m','relative_humidity_2m','visibility'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let venue = null, dayISO = null, pdfBlob = null, pdfName = 'forecast.pdf';

/* ---------- UI ---------- */
function setStatus(t, err){ const s=$('#status'); s.textContent=t||''; s.classList.toggle('err',!!err); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function isoLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function loadRecents(){ try{ return JSON.parse(localStorage.getItem('gw_recent')||'[]'); }catch(e){ return []; } }
function saveRecent(v){
  try{
    const r = loadRecents().filter(x=>!(Math.abs(x.lat-v.lat)<1e-4 && Math.abs(x.lon-v.lon)<1e-4));
    r.unshift({name:v.name, sub:v.sub||'', lat:v.lat, lon:v.lon});
    localStorage.setItem('gw_recent', JSON.stringify(r.slice(0,8)));
  }catch(e){}
  renderRecents();
}
function renderRecents(){
  const box=$('#recent'); box.innerHTML='';
  loadRecents().forEach(v=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=v.name;
    b.onclick=()=>pick(v); box.appendChild(b);
  });
}

function buildDays(){
  const box=$('#days'); box.innerHTML='';
  const now=new Date();
  for(let i=0;i<14;i++){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i);
    const iso=isoLocal(d);
    const b=document.createElement('button'); b.type='button'; b.className='chip';
    const wd=d.toLocaleDateString('en-GB',{weekday:'short'});
    b.innerHTML=`<span>${i===0?'Today':i===1?'Tomorrow':wd}</span><b>${d.getDate()} ${MON[d.getMonth()]}</b>`;
    b.onclick=()=>{ dayISO=iso; [...box.children].forEach(c=>c.classList.toggle('on',c===b)); updateGo(); };
    if(i===0){ dayISO=iso; b.classList.add('on'); }
    box.appendChild(b);
  }
}
function updateGo(){ $('#go').disabled = !(venue && dayISO); }

function pick(v){
  venue = {name:v.name, sub:v.sub||'', lat:+v.lat, lon:+v.lon};
  $('#results').innerHTML='';
  $('#picked').innerHTML = `<div class="picked"><small>${esc(venue.sub || (venue.lat.toFixed(4)+', '+venue.lon.toFixed(4)))}</small>
    <label class="h" for="title" style="font-size:13px;font-weight:500;color:var(--mute);margin-bottom:4px">Name on forecast</label>
    <div class="row"><input id="title" type="text" value="${esc(venue.name)}"></div></div>`;
  setStatus(''); updateGo();
}

async function search(){
  const q=$('#q').value.trim(); if(!q) return;
  $('#q').blur();
  const m=q.match(/^\s*(-?\d{1,2}(?:\.\d+)?)\s*[,; ]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/);
  if(m){ pick({name:'Pinned location', sub:'Coordinates '+m[1]+', '+m[2], lat:+m[1], lon:+m[2]}); return; }
  setStatus('Searching…');
  let res=[];
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&accept-language=en&q='+encodeURIComponent(q));
    if(r.ok){
      const j=await r.json();
      res=j.map(x=>{ const parts=x.display_name.split(',').map(s=>s.trim());
        return {name:x.name||parts[0], sub:parts.slice(1,4).join(', '), lat:+x.lat, lon:+x.lon}; });
    }
  }catch(e){}
  if(!res.length){
    try{
      const name=q;
      const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=8&language=en&format=json&name='+encodeURIComponent(name));
      const j=await r.json();
      res=(j.results||[]).map(x=>({name:x.name, sub:[x.admin1,x.country].filter(Boolean).join(', '), lat:x.latitude, lon:x.longitude}));
    }catch(e){}
  }
  if(!res.length){ $('#results').innerHTML=''; setStatus('No match for “'+q+'”. Try the club’s full name, or paste coordinates like 53.45, -6.12.', true); return; }
  setStatus('');
  const box=document.createElement('div'); box.className='list';
  res.forEach(v=>{
    const b=document.createElement('button'); b.type='button';
    b.innerHTML=`<b>${esc(v.name)}</b><span>${esc(v.sub)}</span>`;
    b.onclick=()=>pick(v); box.appendChild(b);
  });
  $('#results').innerHTML=''; $('#results').appendChild(box);
}

/* ---------- location ---------- */
function getPos(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation) return rej(new Error('nogeo'));
    navigator.geolocation.getCurrentPosition(p=>res(p.coords),rej,{enableHighAccuracy:false,timeout:12000,maximumAge:300000});
  });
}
function distKm(a,b,c,d){
  const R=6371,r=Math.PI/180,dl=(c-a)*r,dn=(d-b)*r;
  const x=Math.sin(dl/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dn/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
async function nameFor(lat,lon){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&accept-language=en&lat=${lat}&lon=${lon}`);
    if(r.ok){ const j=await r.json(), a=j.address||{};
      const n=a.village||a.town||a.city||a.suburb||a.municipality||j.name;
      if(n) return {name:n, sub:[a.county||a.state,a.country].filter(Boolean).join(', ')}; }
  }catch(e){}
  return {name:'My location'};
}
async function useMyLocation(auto){
  setStatus('Finding your location…');
  let c;
  try{ c=await getPos(); }
  catch(e){
    if(auto){ const r=loadRecents(); if(r.length){ pick(r[0]); build(); return; } setStatus(''); return; }
    setStatus(e&&e.code===1?'Location is blocked for this page. Allow it in Settings › Privacy & Security › Location Services › Safari Websites, or search for a course instead.':'Couldn’t get your location. Try again, or search for a course.',true);
    return;
  }
  const lat=+c.latitude.toFixed(4), lon=+c.longitude.toFixed(4);
  const n=await nameFor(lat,lon);
  pick({name:n.name, sub:'Your location'+(n.sub?', '+n.sub:''), lat, lon});
  build({save:false});
}

/* ---------- data ---------- */
async function getJSON(u){
  const r=await fetch(u); const j=await r.json().catch(()=>({}));
  if(!r.ok || j.error) throw new Error(j.reason || ('HTTP '+r.status));
  return j;
}
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const median=a=>{ const s=[...a].sort((x,y)=>x-y), n=s.length; return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2; };
const ok=x=>x!=null && isFinite(x);

function classify(codes, cloud, mm, rain, vis){
  const n=codes.length||1, cnt=f=>codes.filter(f).length;
  if(rain>=30 && cnt(c=>c>=95)>=Math.max(2,n/3)) return {t:'Thunder', i:'thunder'};
  const fog=(ok(vis)&&vis<1000) || cnt(c=>c===45||c===48)>n/2;
  const wet=(rain>=35&&mm>=0.1) || mm>=0.3;
  if(wet){
    const snowy=cnt(c=>(c>=71&&c<=77)||c===85||c===86);
    const liquid=cnt(c=>(c>=51&&c<=67)||(c>=80&&c<=82));
    if(snowy>liquid) return {t:'Snow', i:'snow'};
    if(snowy>0 && snowy>=liquid/2) return {t:'Sleet', i:'sleet'};
    const shw=cnt(c=>c>=80&&c<=82), dz=cnt(c=>c>=51&&c<=57);
    if(dz>liquid/2 && mm<0.5) return {t:'Drizzle', i:'drizzle'};
    if(shw>=Math.max(1,liquid-shw)) return {t: mm<0.5?'Light showers':mm>=2.5?'Heavy showers':'Showers', i: mm>=2.5?'heavy':(ok(cloud)&&cloud>=85?'rain':'showers')};
    return {t: mm<0.5?'Light rain':mm>=2.5?'Heavy rain':'Rain', i: mm>=2.5?'heavy':'rain'};
  }
  if(fog) return {t:'Fog', i:'fog'};
  if(!ok(cloud)){ const m={0:5,1:25,2:55,3:95}; const cc=codes.map(c=>m[c]).filter(ok); cloud=cc.length?mean(cc):50; }
  if(cloud<15) return {t:'Sunny', i:'sunny'};
  if(cloud<40) return {t:'Mostly sunny', i:'mostsun'};
  if(cloud<70) return {t:'Partly cloudy', i:'partly'};
  if(cloud<88) return {t:'Mostly cloudy', i:'cloudy'};
  return {t:'Overcast', i:'overcast'};
}

function nightSky(k){
  const m={sunny:['Clear','clearnight'],mostsun:['Mostly clear','mostnight'],partly:['Partly cloudy','partnight'],showers:[k.t,'rain']};
  return m[k.i]?{t:m[k.i][0],i:m[k.i][1]}:k;
}
function consensus(multi, best){
  const H=multi.hourly||{}, B=best.hourly||{};
  const used=MODELS.filter(m=>{ const a=H['temperature_2m_'+m.id]; return a && a.some(ok); });
  if(!used.length) throw new Error('No forecast models cover that day yet.');
  const sr=best.daily&&best.daily.sunrise&&best.daily.sunrise[0];
  const ss=best.daily&&best.daily.sunset&&best.daily.sunset[0];
  const hm=s=>{ const t=s.slice(11,16).split(':'); return (+t[0])*60+(+t[1]); };
  const srM=sr?hm(sr):null, ssM=ss?hm(ss):null;
  let h0=0, h1=23;
  if(best.utc_offset_seconds!=null){
    const now=new Date(Date.now()+best.utc_offset_seconds*1000);
    const today=now.toISOString().slice(0,10);
    if(B.time&&B.time[0]&&B.time[0].slice(0,10)===today) h0=now.getUTCHours();
  }
  const rows=[];
  (B.time||[]).forEach((tm,i)=>{
    const hour=+tm.slice(11,13); if(hour<h0||hour>h1) return;
    const g=v=>used.map(m=>{ const a=H[v+'_'+m.id]; return a?a[i]:null; }).filter(ok);
    const b=v=>{ const x=B[v]&&B[v][i]; return ok(x)?x:null; };
    const val=v=>{ const a=g(v); return a.length?mean(a):b(v); };
    const temp=val('temperature_2m'), feels=val('apparent_temperature'), hum=val('relative_humidity_2m');
    const wind=val('wind_speed_10m'); let gust=val('wind_gusts_10m'); const cloud=val('cloud_cover');
    const pr=g('precipitation'); const mm=pr.length?mean(pr):(b('precipitation')||0);
    const agree=pr.length?pr.filter(x=>x>=0.1).length/pr.length:(mm>=0.1?1:0);
    const probs=g('precipitation_probability'); const bp=b('precipitation_probability'); if(ok(bp)) probs.push(bp);
    const rain=Math.max(0,Math.min(100,Math.round(probs.length?0.5*mean(probs)+50*agree:100*agree)));
    let x=0,y=0,nd=0;
    used.forEach(m=>{ const d=H['wind_direction_10m_'+m.id], s=H['wind_speed_10m_'+m.id];
      if(d&&s&&ok(d[i])&&ok(s[i])){ const w=s[i]+0.1; x+=Math.sin(d[i]*Math.PI/180)*w; y+=Math.cos(d[i]*Math.PI/180)*w; nd++; } });
    let dir = nd ? (Math.atan2(x,y)*180/Math.PI+360)%360 : b('wind_direction_10m');
    const va=g('visibility'); const vis=va.length?median(va):b('visibility');
    const codes=g('weather_code'); const bc=b('weather_code'); if(ok(bc)) codes.push(bc);
    const daySky=classify(codes, cloud, mm, rain, vis);
    const mid=hour*60+30, night=(srM!=null&&ssM!=null)&&(mid<srM||mid>ssM);
    const sky=night?nightSky(daySky):daySky;
    let visW;
    if(sky.i==='fog') visW='Poor';
    else if(!ok(vis)) visW = sky.i==='heavy'||sky.i==='snow' ? 'Moderate' : 'Good';
    else visW = vis<4000?'Poor':vis<10000?'Moderate':'Good';
    if(ok(wind)) gust=Math.max(ok(gust)?gust:wind, wind);
    rows.push({hour, sky, daySky, night, rain, mm, temp, feels, wind, gust, dir, hum, vis:visW});
  });
  return {rows, used, sr, ss, uv: best.daily&&best.daily.uv_index_max?best.daily.uv_index_max[0]:null,
          tz: best.timezone, tzAbbr: best.timezone_abbreviation, h0, h1};
}

const PW=118, PH=216, S=12; // mm page, px per mm

function sun(c,x,y,r){

  for(let k=0;k<8;k++){ const a=k*Math.PI/4; c.beginPath(); c.moveTo(x+Math.cos(a)*r*1.4,y+Math.sin(a)*r*1.4); c.lineTo(x+Math.cos(a)*r*1.85,y+Math.sin(a)*r*1.85); c.stroke(); }

function cloud(c,x,y,w,fill){

    case 'thunder': cloud(c,x,y-0.12*s,0.9*s,CD); c.save(); c.fillStyle='#F0B400'; c.beginPath();

function compass(d){ if(!ok(d)) return '–'; return ['N','NE','E','SE','S','SW','W','NW'][Math.round(d/45)%8]; }
function hhmm(s){ return s?s.slice(11,16):'–'; }
function wrap(c,text,maxW){

  words.forEach(w=>{ const t=cur?cur+' '+w:w; if(c.measureText(t).width<=maxW||!cur) cur=t; else { lines.push(cur); cur=w; } });

function runLabel(meta){

  ];

  });

function bestWindow(rows){
  const idx=rows.map((r,i)=>r.night?-1:i).filter(i=>i>=0);
  if(idx.length<2) return null;
  const f=idx[0], n=idx.length, w=Math.min(4,n);
  let bi=f, bs=Infinity;
  for(let s=f;s+w<=f+n;s++){
    let sc=0; for(let k=s;k<s+w;k++){ const r=rows[k];
      sc+=r.rain+(r.mm||0)*25+(ok(r.gust)?r.gust:0)*1.5+(ok(r.temp)?Math.max(0,18-r.temp)*2:0); }
    if(sc<bs-1e-9){ bs=sc; bi=s; }
  }
  const seg=rows.slice(bi,bi+w);
  return {from:bi, to:bi+w-1, h0:rows[bi].hour, h1:rows[bi+w-1].hour+1, rain:Math.max(...seg.map(r=>r.rain))};
}

  $('#heroBox').className='hero '+skyClass(dom.i);
  $('#hTitle').textContent=D.title;
  $('#hero').innerHTML=`<div class="hero-main"><span id="bigIcon"></span><div class="temp">${hi}°<small> / ${lo}°</small></div>
      <div class="meta"><div class="cond">${esc(dom.t)}</div><div class="date">${dateStr}</div></div></div>`;
  $('#bigIcon').replaceWith(iconCanvas(dom.i,56));

  let rows='';
  R.forEach((r,i)=>{
    const c=r.rain>=35?'r':r.rain>=25?'a':'g';
    const mm=r.mm<0.05?'–':(r.mm<10?r.mm.toFixed(1):Math.round(r.mm));
    const arrow=ok(r.dir)?`<svg class="arr" viewBox="0 0 24 24" style="transform:rotate(${Math.round((r.dir+180)%360)}deg)" role="img" aria-label="Wind from ${compass(r.dir)}"><path d="M12 2.5l7 9.5h-4.6v9.5H9.6V12H5z" fill="currentColor"/></svg>`:'–';
    const inBw=bw&&i>=bw.from&&i<=bw.to;
    rows+=`<tr${inBw?' class="bw"':''}><td class="t">${p2(r.hour)}:00</td><td class="sky" data-i="${i}" title="${esc(r.sky.t)}"></td>`+
      `<td class="${c}">${r.rain}%</td><td>${mm}</td><td class="tf">${r0(r.temp)}°<span class="dim">${TS}${r0(r.feels)}°</span></td>`+
      `<td>${r0(r.wind)}<span class="dim">${TS}${r0(r.gust)}</span></td><td>${arrow}</td></tr>`;
  });
  $('#fc').innerHTML=`
    <table class="wx">
      <colgroup><col style="width:15.5%"><col style="width:12%"><col style="width:13.5%"><col style="width:10.5%"><col style="width:20%"><col style="width:17.5%"><col style="width:11%"></colgroup>
      <thead><tr><th>Time</th><th>Sky</th><th>Rain</th><th>mm</th><th>°C /<br>feels</th><th>Wind /<br>gust</th><th>Dir</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  $('#fc').querySelectorAll('td.sky').forEach(d=>d.appendChild(iconCanvas(D.rows[+d.dataset.i].sky.i)));
}

function fitRows(){
  const tb=document.querySelector('#fc tbody'); if(!tb) return;
  const n=tb.rows.length||1;
  const sb=document.getElementById('sb').getBoundingClientRect().height||0;
  const top=tb.getBoundingClientRect().top+window.scrollY;
  const rh=Math.max(18,Math.min(44,Math.floor((window.innerHeight-top-sb-2)/n)));
  tb.style.setProperty('--rh',rh+'px');
  tb.closest('table').style.fontSize=Math.min(20,Math.max(12,rh*0.58))+'px';
}
window.addEventListener('resize',()=>requestAnimationFrame(fitRows));

function makePdf(){
  if(!lastD || !window.jspdf) return null;
  const cv=document.createElement('canvas'); draw(cv,lastD);
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:[PW,PH],orientation:'portrait',compress:true});
  doc.addImage(cv.toDataURL('image/png'),'PNG',0,0,PW,PH,undefined,'FAST');
  return doc.output('blob');
}

/* ---------- build ---------- */
async function build(opts){
  if(!venue||!dayISO) return;
  const keep=!(opts&&opts.save===false);
  const title=($('#title')&&$('#title').value.trim())||venue.name;
  $('#go').disabled=true; setStatus('Checking '+MODELS.length+' forecast models…');
  try{
    const base=`https://api.open-meteo.com/v1/forecast?latitude=${venue.lat.toFixed(4)}&longitude=${venue.lon.toFixed(4)}&timezone=auto&wind_speed_unit=ms&start_date=${dayISO}&end_date=${dayISO}`;
    const metaP=Promise.all(MODELS.map(m=>fetch(`https://api.open-meteo.com/data/${m.meta}/static/meta.json`).then(r=>r.ok?r.json():null).catch(()=>null)));
    const [multi,best]=await Promise.all([
      getJSON(base+'&hourly='+HV.join(',')+'&models='+MODELS.map(m=>m.id).join(',')),
      getJSON(base+'&hourly='+HV.join(',')+'&daily=sunrise,sunset,uv_index_max')
    ]);
    const metas=await Promise.race([metaP,new Promise(r=>setTimeout(()=>r(MODELS.map(()=>null)),4000))]);
    const D=consensus(multi,best);
    if(!D.rows.length) throw new Error('No hourly data for that day.');
    Object.assign(D,{title, day:dayISO, lat:venue.lat, lon:venue.lon, metas});
    D.issued=new Date();
    lastD=D; pdfBlob=null;
    document.body.classList.add('has-result');
    $('#out').classList.add('show');
    renderHTML(D);
    window.scrollTo(0,0);
    fitRows();
    if(keep) saveRecent({...venue, name:title});
    pdfName=(title+' '+dayISO+' forecast').replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,' ').trim()+'.pdf';
    setStatus('');
  }catch(e){
    const msg=String(e.message||e);
    setStatus(/fetch|network|load/i.test(msg)?'Couldn’t reach the forecast service. Check your connection and build again.':
      /date|range|parameter/i.test(msg)?'That day is outside the forecast range. Pick a nearer day.':msg, true);
  }finally{ updateGo(); }
}

function openPdf(){
  if(!pdfBlob) return;
  const u=URL.createObjectURL(pdfBlob); const a=document.createElement('a');
  a.href=u; a.download=pdfName; a.target='_blank'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),60000);
}
async function sharePdf(){
  if(!pdfBlob) pdfBlob=makePdf();
  if(!pdfBlob){ setStatus('The PDF tool didn’t load. Check your connection and try again.',true); return; }
  const f=new File([pdfBlob],pdfName,{type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[f]})){ try{ await navigator.share({files:[f],title:pdfName}); }catch(e){} }
  else openPdf();
}

function makeTouchIcon(){
  try{
    const cv=document.createElement('canvas'); cv.width=cv.height=180; const c=cv.getContext('2d');
    const g=c.createLinearGradient(0,0,0,180); g.addColorStop(0,'#1C5FA8'); g.addColorStop(1,'#8CC4EA');
    c.fillStyle=g; c.fillRect(0,0,180,180);
    icon(c,'partly',90,92,150);
    $('#touchIcon').href=cv.toDataURL('image/png');
  }catch(e){}
}

$('#searchForm').addEventListener('submit',search);
$('#go').addEventListener('click',build);
$('#share').addEventListener('click',sharePdf);
$('#change').addEventListener('click',()=>{ $('#planner').scrollIntoView({behavior:'smooth',block:'start'}); setTimeout(()=>$('#q').focus(),350); });
$('#refresh').addEventListener('click',()=>build({save:false}));
$('#locBtn').addEventListener('click',()=>useMyLocation(false));
buildDays(); renderRecents(); makeTouchIcon();
useMyLocation(true);
</script>
